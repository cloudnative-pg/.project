# Registry identifiers for every image cloudnative-pg publishes. The
# postgres-extensions-containers repo publishes one image per extension
# (not a single package), and postgres-trunk-containers has no fixed
# published name at all -- it builds ephemeral images on demand from
# whatever PostgreSQL branch/patch is requested, so it is not listed here.
# klio's images are still published under ghcr.io/enterprisedb/klio* as of
# this writing (the repo was only just moved from EnterpriseDB to this
# org) -- oci_klio below is the intended cloudnative-pg/klio location,
# not yet where the packages actually are.
package_managers:
  oci_cloudnativepg: "ghcr.io/cloudnative-pg/cloudnative-pg"
  oci_postgresql: "ghcr.io/cloudnative-pg/postgresql"
  oci_pgbouncer: "ghcr.io/cloudnative-pg/pgbouncer"
  oci_postgis: "ghcr.io/cloudnative-pg/postgis"
  oci_plugin_barman_cloud: "ghcr.io/cloudnative-pg/plugin-barman-cloud"
  oci_klio: "ghcr.io/cloudnative-pg/klio"
  oci_pgvector: "ghcr.io/cloudnative-pg/pgvector"
  oci_postgis_extension: "ghcr.io/cloudnative-pg/postgis-extension"
  oci_pgaudit: "ghcr.io/cloudnative-pg/pgaudit"
  oci_pg_ivm: "ghcr.io/cloudnative-pg/pg-ivm"
  oci_pg_crash: "ghcr.io/cloudnative-pg/pg-crash"
  oci_timescaledb_oss: "ghcr.io/cloudnative-pg/timescaledb-oss"
  oci_wal2json: "ghcr.io/cloudnative-pg/wal2json"

